    function compareValue(type,x,measured,nominal=false){

      return Math.min(.97,Math.max(.04,y+(measured ? .006*Math.sin(x*79) : 0)));

    document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;if(action==='nav'){go(id);return}if(action.startsWith('go-')){go(action.slice(3));return}if(action==='select-blueprint'){state.blueprint=id;render();return}if(action==='start-blueprint'){const two=state.blueprint==='two';startRun(two?'Q12–Q13 双比特 CZ 校准':'Q12 单比特标准校准','流程',two?'Q12–Q13':'Q12',two?17:9);return}if(action==='skill-tab'){state.skillTab=id;render();return}if(action==='filter-data'){state.dataFilter=target.dataset.filter;render();return}if(action==='task-detail'||action==='expert-detail'||action==='data-detail'){state.modal={type:action.split('-')[0],id};renderModal();return}if(action==='pulse-detail'){state.modal={type:'pulse'};renderModal();return}if(action==='close-modal'){state.modal=null;$('#modal-root').innerHTML='';return}if(action==='prompt'){const input=$('#agent-input');input.value=target.dataset.text;input.focus();return}if(action==='save-draft'||action==='submit-experiment'){const form=$('#experiment-form');if(!form.reportValidity())return;const d=new FormData(form),name=String(d.get('name')).trim(),type=String(d.get('type')),targetQ=String(d.get('target'));if(!name){toast('请输入实验名称');return}if(action==='save-draft'){state.drafts.unshift({name,type,target:targetQ,updated:'刚刚'});render();toast('实验草稿已保存到当前浏览器演示状态')}else startRun(name,'基础实验',targetQ,1);return}if(action==='load-draft'){const d=state.drafts[Number(target.dataset.index)];const form=$('#experiment-form');form.elements.name.value=d.name;form.elements.type.value=d.type;form.elements.target.value=d.target;toast('已载入草稿，可继续编辑');return}if(action==='delete-draft'){const idx=Number(target.dataset.index);state.drafts.splice(idx,1);render();toast('演示草稿已删除');return}if(action==='download-code'){download('s21_scan_example.txt','# S21 模拟扫描配置\ntarget=Q12\ncenter_ghz=7.220\npoints=41\n');toast('已下载示例代码');return}if(action==='export-data'){download('experiment_data_demo.csv','id,name,source\nDS-2048,Q12 S21,simulator\nDS-2047,Q12 F01,simulator\n');toast('已导出模拟数据清单');return}if(action==='share-data'){toast(`${id} 的分享设置为交互示意；正式版需权限和有效期`);return}if(action==='add-gate'){state.gates.push(target.dataset.gate);render();return}if(action==='undo-gate'){state.gates.pop();render();return}if(action==='clear-gates'){state.gates=[];render();return}if(action==='download-qasm'){const lines=['OPENQASM 3;','qubit[2] q;','bit[2] c;',...state.gates.map((g,i)=>g==='CX'?'cx q[0], q[1];':g==='M'?'c = measure q;':`${g.toLowerCase()} q[${i%2}];`)];download('demo_circuit.qasm',lines.join('\n'));toast('已下载示意 QASM');return}if(action==='run-circuit'){state.simulated=true;render();toast('虚拟计算服务已返回模拟结果');return}if(action==='run-ide'){state.ideRan=true;render();toast('示例环境运行完成，仅为页面演示');return}});
    document.addEventListener('submit',e=>{if(e.target.id!=='agent-form')return;e.preventDefault();const text=$('#agent-input').value.trim();if(!text)return;state.messages.push({role:'user',text});let reply;if(/CZ|双比特|两比特|耦合/i.test(text))reply='当前会话绑定单比特流程，只允许 Q12 的单比特校准。双比特 CZ 需要选择双比特流程，再核对 Q12–Q13 的设备资源。';else if(/发布|写回|下发|急停|删除/i.test(text))reply='该动作需要独立的服务端授权与审批。我可以整理候选参数和证据，但不会在对话中直接写入设备。';else if(/异常|故障|失败/i.test(text))reply='建议先读取最近一次 F01 原始频谱、当前读出参数版本和设备回执，检查峰值质量、漂移与扫描范围。若证据不足，进入人工接管。';else reply='已将目标转为模拟提案：对 Q12 执行读出 S21 扫描，中心 7.220 GHz、41 点，最大尝试 2 次。下一步应由策略层校验流程、设备资源和参数边界，再启动模拟测量。';state.messages.push({role:'agent',text:reply});render();const box=$('#chat-messages');box.scrollTop=box.scrollHeight});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;$('#modal-root').innerHTML=''}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();e.target.click()}});
    document.addEventListener('click',e=>{const run=e.target.closest('[data-action="open-comparison"]');if(run){state.comparisonRun=run.dataset.id;state.comparisonStep=null;go('comparison');return}const step=e.target.closest('[data-action="select-comparison-step"]');if(step){state.comparisonStep=step.dataset.type;render()}});
    document.addEventListener('change',e=>{if(e.target.dataset.action==='toggle-ideal'){state.showIdeal=e.target.checked;render()}else if(e.target.dataset.action==='toggle-measured'){state.showMeasured=e.target.checked;render()}});
    function validateCustom(kind,entry,publish){
      if(entry.name.length<2)return '名称至少需要 2 个字符';
      if(!publish)return '';
      if(!entry.description)return '发布前请填写职责或用途说明';
      if(kind==='experts'){
        if(!entry.allowedSkills)return '请填写允许使用的 Skill';
        if(['single','both'].includes(entry.scope)&&/CZ/i.test(entry.allowedSkills))return '含 CZ 的专家能力不能绑定单比特流程';
      }
      if(kind==='skills'){
        if(entry.experiment==='CZ 校准'&&['single','both'].includes(entry.scope))return 'CZ Skill 只能绑定双比特流程';
        if(!entry.qualityGate)return '请填写质量门规则';
        if(!Number.isInteger(entry.maxRetries)||entry.maxRetries<0||entry.maxRetries>3)return '重试次数需在 0–3 之间';
        try{if(JSON.parse(entry.inputSchema).type!=='object'||JSON.parse(entry.outputSchema).type!=='object')return '输入和输出 Schema 的顶层 type 应为 object'}catch{return '输入和输出 Schema 必须是有效 JSON'}
      }
      if(kind==='connectors'){
        if(!entry.endpoint||!entry.capabilities)return '请填写接口地址和能力清单';
        if(entry.category==='现场网关'&&entry.endpoint.startsWith('sim:'))return '现场网关需要填写真实接口地址；本原型不会尝试连接';
      }
      return '';
    }
    document.addEventListener('click',e=>{
      const target=e.target.closest('[data-action]');if(!target)return;
      const action=target.dataset.action,kind=target.dataset.kind;
      if(action==='open-custom'||action==='edit-custom'){
        if(!customInfo[kind])return;
        state.modal={type:'custom',kind,id:action==='edit-custom'?target.dataset.id:null};
        renderCustomModal();return;
      }
      if(action==='disable-custom'){
        if(!customInfo[kind])return;
        const entry=state.custom[kind].find(x=>x.id===target.dataset.id);
        if(!entry||entry.status!=='published')return;
        entry.status='disabled';entry.updated=Date.now();persistCustom();render();toast('自定义能力已在本地目录停用');return;
      }
      if(action!=='save-custom'&&action!=='publish-custom')return;
      const form=$('#custom-form');if(!form||!form.reportValidity())return;
      const formKind=form.dataset.kind;if(!customInfo[formKind])return;
      const values=Object.fromEntries(new FormData(form).entries());
      const entry={
        name:String(values.name||'').trim(),scope:String(values.scope||'none'),description:String(values.description||'').trim(),
        role:String(values.role||''),allowedSkills:String(values.allowedSkills||'').trim(),outputMode:String(values.outputMode||''),
        experiment:String(values.experiment||''),maxRetries:Number(values.maxRetries??1),inputSchema:String(values.inputSchema||'').trim(),
        outputSchema:String(values.outputSchema||'').trim(),qualityGate:String(values.qualityGate||'').trim(),
        category:String(values.category||''),protocol:String(values.protocol||''),endpoint:String(values.endpoint||'').trim(),
        capabilities:String(values.capabilities||'').trim()
      };
      const publish=action==='publish-custom',error=validateCustom(formKind,entry,publish);
      if(error){toast(error);return}
      const existing=state.custom[formKind].find(x=>x.id===form.dataset.editId);
      const logicalId=existing?.logicalId||`custom-${formKind}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
      const versions=state.custom[formKind].filter(x=>x.logicalId===logicalId).map(x=>Number(x.version)||1);
      const version=existing&&existing.status==='draft'?Number(existing.version)||1:versions.length?Math.max(...versions)+1:1;
      const record={...entry,id:existing?.status==='draft'?existing.id:`${logicalId}-v${version}`,logicalId,version,status:publish?'published':'draft',updated:Date.now()};
      if(existing?.status==='draft')state.custom[formKind][state.custom[formKind].indexOf(existing)]=record;
      else if(state.custom[formKind].length<100)state.custom[formKind].push(record);
      else{toast('本地原型最多保存 100 个版本');return}
      if(publish)for(const older of state.custom[formKind])if(older!==record&&older.logicalId===logicalId&&older.status==='published')older.status='archived';
      const saved=persistCustom();state.modal=null;$('#modal-root').innerHTML='';render();
      if(saved)toast(publish?'已发布到浏览器本地能力目录':'已保存自定义草稿');
    });
    $('#date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const hash=location.hash.slice(1);if(views[hash])state.view=hash;
    render();
  })();
  </script>
</body>
</html>
