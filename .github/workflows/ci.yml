name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Node contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run contract, simulator and gateway tests
        working-directory: frontend
        run: npm test

  backend-e2e:
    name: Cross-repo HTTP E2E
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable to the QuantaMind backend checkout.
    if: ${{ vars.QUANTAMIND_BACKEND_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout QuantaMind backend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.QUANTAMIND_BACKEND_REPOSITORY }}
          token: ${{ secrets.QUANTAMIND_BACKEND_TOKEN }}
          path: backend-repo

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend-repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start backend
        working-directory: backend-repo
        env:
          QUANTAMIND_DATABASE_URL: sqlite:///./e2e.db
          QUANTAMIND_DEV_AUTH: "true"
          QUANTAMIND_CALIBRATION_WORKER: "true"
          QUANTAMIND_CALIBRATION_TICK_SECONDS: "0.2"
          QUANTAMIND_CALIBRATION_LEASE_SECONDS: "30"
        run: |
          python -m uvicorn backend.quantamind_api.app:app --host 127.0.0.1 --port 18789 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18789/api/v1/health && break
            sleep 1
          done

      - name: Run cross-repo E2E
        working-directory: frontend
        env:
          QUANTAMIND_E2E_BASE_URL: http://127.0.0.1:18789
        run: npm test
