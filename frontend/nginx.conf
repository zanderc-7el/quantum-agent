server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:5290;
        proxy_set_header Host $host;
        # This is a loopback-only shared demo, not an authenticated production API.
    }
    location = /health {
        proxy_pass http://backend:5290/health;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
